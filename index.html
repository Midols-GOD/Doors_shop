<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ДвериКом — Входные и межкомнатные двери с установкой</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        body {
            background-color: #ffffff;
            color: #222222;
            line-height: 1.6;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            border-bottom: 1px solid #eaeaea;
            background: #ffffff;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #111;
        }
        nav a {
            margin: 0 15px;
            text-decoration: none;
            color: #555;
            font-weight: 500;
            transition: color 0.2s;
        }
        nav a:hover {
            color: #000;
        }
        .phone {
            font-weight: bold;
            color: #111;
        }
        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 80px 50px;
            background: #f9f9f9;
        }
        .hero-content {
            max-width: 600px;
        }
        .hero-content h1 {
            font-size: 42px;
            margin-bottom: 20px;
            color: #111;
        }
        .hero-content p {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            background: #111;
            color: #fff;
            padding: 14px 30px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #333;
        }
        .hero-image {
            width: 450px;
            height: 300px;
            background: #e0e0e0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">ДвериКом</div>
        <nav>
            <a href="#">Входные двери</a>
            <a href="#">Межкомнатные двери</a>
            <a href="#">Установка</a>
            <a href="#">Контакты</a>
        </nav>
        <div class="phone">+38 (099) 000-00-00</div>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h1>Надежные входные и межкомнатные двери для вашего дома</h1>
            <p>Широкий ассортимент, бесплатный замер, профессиональный монтаж с гарантией под ключ.</p>
            <a href="#" class="btn">Выбрать дверь</a>
        </div>
        <div class="hero-image">
            [ Фото двери / Слайдер ]
        </div>
    </section>

</body>
</html>
